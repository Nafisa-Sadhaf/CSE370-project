<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Capital Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="auth-container" class="auth-wrapper">
    <div class="glass-card auth-card">
        <div class="logo justify-center mb-6">
            <div class="logo-icon"></div>
            <h2>Capital<br>Advisor</h2>
        </div>

        {% if error %}
            <p style="color:var(--danger);text-align:center;margin-bottom:12px;font-size:0.9rem;">{{ error }}</p>
        {% endif %}
        {% if signup_error %}
            <p style="color:var(--danger);text-align:center;margin-bottom:12px;font-size:0.9rem;">{{ signup_error }}</p>
        {% endif %}

        <form id="login-form" class="auth-form active" action="/login" method="POST">
            <h3 class="auth-title">Welcome Back</h3>
            <p class="auth-subtitle">Login to your account</p>
            <div class="input-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="client">Client</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="primary-btn full-width justify-center mt-4">Log In</button>
            <p class="auth-switch">Don't have an account? <span onclick="toggleAuth('signup')">Create one</span></p>
        </form>

        <form id="signup-form" class="auth-form" action="/signup" method="POST">
            <h3 class="auth-title">Create Account</h3>
            <p class="auth-subtitle">Join Capital Advisor today</p>
            <div class="input-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="client">Client</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a password" required>
            </div>
            <button type="submit" class="primary-btn full-width justify-center mt-4">Sign Up</button>
            <p class="auth-switch">Already have an account? <span onclick="toggleAuth('login')">Log in</span></p>
        </form>
    </div>
</div>

<script>
function toggleAuth(type) {
    if (type === 'login') {
        document.getElementById('login-form').classList.add('active');
        document.getElementById('signup-form').classList.remove('active');
    } else {
        document.getElementById('signup-form').classList.add('active');
        document.getElementById('login-form').classList.remove('active');
    }
}
{% if signup_error %}
toggleAuth('signup');
{% endif %}
</script>
</body>
</html>
